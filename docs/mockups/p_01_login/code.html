<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0d1322;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "inverse-on-surface": "#2b3040", "surface-container-highest": "#2f3445", "secondary-container": "#40465a", "on-tertiary-container": "#00734d", "primary-fixed-dim": "#9ad900", "surface": "#0d1322", "on-primary-fixed-variant": "#354e00", "outline-variant": "#424934", "on-surface-variant": "#c2caae", "on-primary-fixed": "#131f00", "surface-container-high": "#24293a", "background": "#0d1322", "primary-container": "#b2f722", "on-primary-container": "#4c6e00", "tertiary-container": "#6bfcbb", "surface-bright": "#33394a", "outline": "#8c947a", "inverse-primary": "#486800", "error-container": "#93000a", "primary-fixed": "#b2f722", "secondary-fixed": "#dce2fa", "on-primary": "#233600", "surface-tint": "#9ad900", "surface-container-low": "#161b2b", "secondary": "#c0c6dd", "error": "#ffb4ab", "surface-dim": "#0d1322", "secondary-fixed-dim": "#c0c6dd", "on-error-container": "#ffdad6", "primary": "#ffffff", "on-secondary": "#2a3042", "on-error": "#690005", "surface-container-lowest": "#080e1d", "on-secondary-fixed": "#151b2c", "on-secondary-container": "#afb4cb", "on-tertiary-fixed": "#002113", "on-background": "#dde2f8", "inverse-surface": "#dde2f8", "on-secondary-fixed-variant": "#40465a", "surface-variant": "#2f3445", "on-tertiary": "#003824", "tertiary-fixed-dim": "#4adfa1", "on-surface": "#dde2f8", "surface-container": "#1a1f2f", "tertiary-fixed": "#6bfcbb", "tertiary": "#ffffff", "on-tertiary-fixed-variant": "#005236" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-lg": "1.5rem", "gutter-mobile": "0.75rem", "margin": "1.5rem", "space-xl": "2rem", "space-xs": "0.5rem", "space-sm": "0.75rem", "space-md": "1rem", "gutter": "1rem" }, "fontFamily": { "title-section": ["Inter"], "headline-screen": ["Inter"], "title-card": ["Inter"], "display-balance-mobile": ["Inter"], "body-medium": ["Inter"], "caption-regular": ["Inter"], "label-pill": ["Inter"], "body-default": ["Inter"], "display-balance": ["Inter"], "caption-medium": ["Inter"] }, "fontSize": { "title-section": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-screen": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-card": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "500" }], "display-balance-mobile": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-medium": ["15px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "500" }], "caption-regular": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "400" }], "label-pill": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-default": ["15px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }], "display-balance": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "caption-medium": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }] } } } };</script></head><body class="bg-surface text-on-surface pt-safe pb-safe min-h-screen flex flex-col antialiased"><main class="flex-1 flex flex-col relative w-full px-margin bg-surface"><div class="flex flex-col w-full items-center justify-center my-auto py-space-md">
<!-- Ambient Obsidian Glow Spot Behind Card -->
<div class="relative w-full max-w-sm flex flex-col items-center">
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-48 h-48 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Main Login Card Container -->
<div class="relative w-full bg-surface-container rounded-[28px] p-margin shadow-2xl flex flex-col items-center">
<!-- Brand & Mascot Header -->
<div class="relative flex flex-col items-center mb-space-lg text-center">
<!-- FlowCash Logo Mark with Kinetic Soft Radiance -->
<div class="relative mb-space-sm flex items-center justify-center">
<div class="absolute inset-0 rounded-full bg-primary-container/20 blur-md scale-125"></div>
<div class="relative w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center shadow-lg">
<img alt="FlowCash Mark" class="w-10 h-10 object-contain drop-shadow-[0_2px_8px_rgba(185,255,44,0.4)]" src="https://lh3.googleusercontent.com/aida/AEtjO1WRZD9zZPZR7fxc83Ps6EE7q8GWNfFEbxq_OKNR4gz32S6Rs_bVpFV59Ck1TOwu4LhHtJIh3czv1JjnZTer96ekxODRRPnq1yabOsBPQR7-z7P29NzMWqPPULrTYCtgJHMbl-smtFiqqiu6usKDTrlUOGxx6dgvxtnaN65D-ljWt2dFZKCR9GYxUMpSObo4OYtuHPpR2D_PwzJCIHruK9k3_KJ2KQUIm7jfXQYGhXwM7YmWK9vSesKXN-I"/>
</div>
</div>
<h1 class="font-headline-screen text-headline-screen text-primary tracking-tight">
          FlowCash
        </h1>
<p class="font-caption-regular text-caption-regular text-secondary mt-1">
          Take control of your daily income.
        </p>
</div>
<!-- Credentials Form -->
<form class="w-full flex flex-col space-y-space-md" onsubmit="event.preventDefault();">
<!-- Email Input Stack -->
<div class="flex flex-col space-y-space-xs text-left w-full">
<label class="font-caption-medium text-caption-medium text-secondary pl-1" for="email">
            Email Address
          </label>
<div class="relative flex items-center h-14 w-full bg-surface-container-low rounded-[22px] px-space-md transition-all focus-within:ring-1 focus-within:ring-primary-container">
<span class="material-symbols-outlined text-secondary mr-space-sm select-none">mail</span>
<input class="bg-transparent font-body-medium text-body-medium text-primary w-full outline-none placeholder-secondary-container" id="email" placeholder="name@flowcash.io" type="email" value="alexandra.chen@flowcash.io"/>
</div>
</div>
<!-- Password Input Stack -->
<div class="flex flex-col space-y-space-xs text-left w-full">
<div class="flex items-center justify-between pl-1 pr-1">
<label class="font-caption-medium text-caption-medium text-secondary" for="password">
              Password
            </label>
<button class="font-label-pill text-label-pill text-primary-container hover:opacity-80 transition-opacity" type="button">
              Forgot password?
            </button>
</div>
<div class="relative flex items-center h-14 w-full bg-surface-container-low rounded-[22px] px-space-md transition-all focus-within:ring-1 focus-within:ring-primary-container">
<span class="material-symbols-outlined text-secondary mr-space-sm select-none">lock</span>
<input class="bg-transparent font-body-medium text-body-medium text-primary w-full outline-none tracking-widest placeholder-secondary-container" id="password" placeholder="••••••••••••" type="password" value="SecureKeyPass2025"/>
<button aria-label="Toggle password visibility" class="text-secondary hover:text-primary transition-colors focus:outline-none flex items-center justify-center p-1" id="toggle-pwd" type="button">
<span class="material-symbols-outlined select-none text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Sign In Action -->
<button class="w-full h-14 bg-primary-container rounded-[24px] font-title-card text-title-card text-surface font-semibold flex items-center justify-center active:scale-[0.98] transition-transform shadow-[0_8px_24px_rgba(185,255,44,0.25)] hover:shadow-[0_8px_28px_rgba(185,255,44,0.35)] mt-space-sm" type="submit">
          Sign In
        </button>
</form>
<!-- Biometric Quick Login Access -->
<div class="flex flex-col items-center mt-space-lg w-full">
<div class="flex items-center justify-center space-x-space-md mb-space-sm">
<span class="h-[1px] w-12 bg-surface-bright"></span>
<span class="font-label-pill text-label-pill text-secondary uppercase tracking-wider">Fast Biometrics</span>
<span class="h-[1px] w-12 bg-surface-bright"></span>
</div>
<button aria-label="Authenticate with Passkey or Biometrics" class="w-14 h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 transition-all flex items-center justify-center shadow-lg group relative" type="button">
<span class="material-symbols-outlined text-primary-container text-[28px] group-hover:scale-110 transition-transform">fingerprint</span>
<span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-primary-container rounded-full ring-2 ring-surface-container flex items-center justify-center">
<span class="w-1.5 h-1.5 bg-surface rounded-full"></span>
</span>
</button>
</div>
<!-- Registration Pathway Footer -->
<div class="mt-space-lg pt-space-xs text-center">
<p class="font-caption-regular text-caption-regular text-secondary">
          Don't have an account? 
          <a class="font-caption-medium text-caption-medium text-primary-container font-semibold hover:underline inline-flex items-center ml-1" href="#">
            Create account
          </a>
</p>
</div>
</div>
<!-- Security Micro-Trust Badge -->
<div class="flex items-center justify-center space-x-1.5 mt-space-md opacity-60">
<span class="material-symbols-outlined text-[15px] text-secondary">shield</span>
<span class="font-label-pill text-label-pill text-secondary">Bank-grade 256-bit encryption</span>
</div>
</div>
</div>
<script>
  (function() {
    var toggleBtn = document.getElementById('toggle-pwd');
    var pwdInput = document.getElementById('password');
    var eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        var isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        pwdInput.classList.toggle('tracking-widest', !isPassword);
      });
    }
  })();
</script></main></body></html>
