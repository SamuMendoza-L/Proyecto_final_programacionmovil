    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface flex flex-col min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.12)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-on-surface active:scale-95 transition-transform" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-title-section text-title-section text-primary truncate max-w-[200px]">Quick Action</h1></div><div class="flex items-center gap-space-sm"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1WRZD9zZPZR7fxc83Ps6EE7q8GWNfFEbxq_OKNR4gz32S6Rs_bVpFV59Ck1TOwu4LhHtJIh3czv1JjnZTer96ekxODRRPnq1yabOsBPQR7-z7P29NzMWqPPULrTYCtgJHMbl-smtFiqqiu6usKDTrlUOGxx6dgvxtnaN65D-ljWt2dFZKCR9GYxUMpSObo4OYtuHPpR2D_PwzJCIHruK9k3_KJ2KQUIm7jfXQYGhXwM7YmWK9vSesKXN-I"/></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface"><div class="flex flex-col w-full pb-8 select-none">
<!-- Interactive Form Body -->
<form class="flex flex-col gap-space-md w-full" id="incomeForm" onsubmit="event.preventDefault(); triggerCelebration();">
<!-- 1. Large Amount Input Card -->
<div class="relative overflow-hidden bg-surface-container rounded-[22px] p-space-lg shadow-xl transition-all duration-300">
<div class="absolute -right-8 -top-8 w-32 h-32 bg-primary-container/10 rounded-full blur-2xl pointer-events-none"></div>
<div class="flex items-center justify-between mb-space-sm relative z-10">
<label class="font-label-pill text-label-pill text-secondary uppercase tracking-widest">Income Amount</label>
<!-- Currency Pill -->
<button class="flex items-center gap-1 bg-surface-container-high active:bg-surface-container-highest px-3 py-1 rounded-full text-on-surface text-[12px] font-medium transition-all active:scale-95 shadow-sm" type="button">
<span class="w-2 h-2 rounded-full bg-primary-fixed-dim inline-block animate-pulse"></span>
<span>USD ($)</span>
<span class="material-symbols-outlined text-[16px] text-secondary">expand_more</span>
</button>
</div>
<div class="flex items-baseline gap-2 relative z-10 py-1">
<span class="font-display-balance-mobile text-display-balance-mobile text-primary-fixed-dim">$</span>
<div class="flex items-center flex-1 min-w-0">
<input aria-label="Amount input" class="bg-transparent font-display-balance-mobile text-display-balance-mobile text-primary tracking-tight w-full focus:outline-none p-0 border-0" id="amountInput" type="text" value="4,500.00"/>
<span class="w-[3px] h-8 bg-primary-fixed-dim rounded-full animate-pulse ml-0.5 inline-block"></span>
</div>
</div>
<div class="mt-space-sm pt-space-xs flex items-center justify-between text-secondary">
<span class="font-caption-regular text-caption-regular">Estimated cleared balance</span>
<span class="font-caption-medium text-caption-medium text-tertiary-fixed-dim">Instant Availability</span>
</div>
</div>
<!-- 2. Category Selector Card -->
<div class="bg-surface-container rounded-[22px] p-space-lg shadow-md flex flex-col gap-space-sm transition-all duration-300">
<span class="font-caption-medium text-caption-medium text-secondary">Category</span>
<button class="w-full flex items-center justify-between bg-surface-container-high hover:bg-surface-container-highest active:scale-[0.99] p-3 rounded-2xl transition-all" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-10 h-10 rounded-xl bg-on-tertiary-container/30 flex items-center justify-center text-primary-fixed-dim shadow-[0_0_16px_rgba(178,247,34,0.2)]">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<div class="flex flex-col items-start min-w-0">
<span class="font-title-card text-title-card text-primary truncate" id="activeCategoryText">Consulting &amp; Retainer</span>
<span class="font-caption-regular text-caption-regular text-secondary">Professional Services</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary text-[22px]">expand_more</span>
</button>
<!-- Quick Chip Pills -->
<div class="flex items-center gap-2 overflow-x-auto pt-1 no-scrollbar -mx-1 px-1">
<button class="category-chip h-9 px-4 rounded-full bg-surface-container-high text-secondary hover:text-primary active:scale-95 text-[13px] font-medium whitespace-nowrap transition-all" onclick="setQuickCategory('Salary')" type="button">
          Salary
        </button>
<button class="category-chip h-9 px-4 rounded-full bg-surface-container-high text-secondary hover:text-primary active:scale-95 text-[13px] font-medium whitespace-nowrap transition-all" onclick="setQuickCategory('Freelance')" type="button">
          Freelance
        </button>
<button class="category-chip h-9 px-4 rounded-full bg-surface-container-high text-secondary hover:text-primary active:scale-95 text-[13px] font-medium whitespace-nowrap transition-all" onclick="setQuickCategory('Investment')" type="button">
          Investment
        </button>
<button class="category-chip h-9 px-4 rounded-full bg-surface-container-high text-secondary hover:text-primary active:scale-95 text-[13px] font-medium whitespace-nowrap transition-all" onclick="setQuickCategory('Bonus')" type="button">
          Bonus
        </button>
</div>
</div>
<!-- 3. Date Picker Card -->
<div class="bg-surface-container rounded-[22px] p-space-lg shadow-md flex flex-col gap-space-xs transition-all duration-300">
<span class="font-caption-medium text-caption-medium text-secondary">Deposit Date</span>
<button class="w-full flex items-center justify-between py-1 active:opacity-80 transition-opacity" type="button">
<div class="flex items-center gap-space-sm">
<div class="w-10 h-10 rounded-xl bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<span class="font-title-card text-title-card text-primary">Today, Oct 24, 2025</span>
</div>
<span class="material-symbols-outlined text-secondary text-[22px]">calendar_month</span>
</button>
</div>
<!-- 4. Account / Destination Card -->
<div class="bg-surface-container rounded-[22px] p-space-lg shadow-md flex flex-col gap-space-xs transition-all duration-300">
<span class="font-caption-medium text-caption-medium text-secondary">Deposit To</span>
<button class="w-full flex items-center justify-between py-1 active:opacity-80 transition-opacity" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-10 h-10 rounded-xl bg-secondary-container flex items-center justify-center text-primary-fixed-dim">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<div class="flex flex-col items-start min-w-0">
<span class="font-title-card text-title-card text-primary truncate">Flow Cash Primary Vault</span>
<span class="font-caption-regular text-caption-regular text-secondary">Checking ••8842</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary text-[22px]">swap_horiz</span>
</button>
</div>
<!-- 5. Optional Note Card -->
<div class="bg-surface-container rounded-[22px] p-space-lg shadow-md flex flex-col gap-space-xs transition-all duration-300">
<label class="font-caption-medium text-caption-medium text-secondary" for="noteInput">Note / Reference (Optional)</label>
<div class="flex items-center gap-space-sm pt-1">
<span class="material-symbols-outlined text-secondary text-[20px]">edit_note</span>
<input class="bg-transparent font-body-default text-body-default text-primary placeholder:text-outline-variant w-full focus:outline-none border-0 p-0" id="noteInput" placeholder="e.g., Q4 Advisory milestone payment #2" type="text"/>
</div>
</div>
<!-- 6. Primary Action Button -->
<div class="pt-space-sm pb-space-lg relative flex flex-col items-center">
<button class="w-full h-14 rounded-[24px] bg-primary-fixed text-on-primary-fixed font-title-card text-title-card flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-200 shadow-[0_8px_24px_rgba(185,255,44,0.25)] hover:shadow-[0_12px_28px_rgba(185,255,44,0.35)]" id="saveBtn" type="submit">
<span class="material-symbols-outlined text-[22px] font-bold">arrow_downward</span>
<span>Save Income</span>
</button>
<!-- Feedback Micro-Toast Container -->
<div class="opacity-0 translate-y-3 pointer-events-none transition-all duration-300 absolute -top-4 bg-surface-bright text-on-surface px-4 py-2 rounded-full shadow-2xl flex items-center gap-2" id="toastNotification">
<span class="material-symbols-outlined text-primary-fixed-dim text-[18px]">check_circle</span>
<span class="font-caption-medium text-caption-medium text-primary">Deposit scheduled successfully!</span>
</div>
</div>
</form>
</div>
<script>
  function setQuickCategory(categoryName) {
    const textElement = document.getElementById('activeCategoryText');
    if (textElement) {
      textElement.textContent = categoryName;
    }
    
    const chips = document.querySelectorAll('.category-chip');
    chips.forEach(chip => {
      if (chip.textContent.trim() === categoryName) {
        chip.className = 'category-chip h-9 px-4 rounded-full bg-primary-fixed text-on-primary-fixed text-[13px] font-semibold whitespace-nowrap transition-all shadow-[0_0_12px_rgba(178,247,34,0.3)]';
      } else {
        chip.className = 'category-chip h-9 px-4 rounded-full bg-surface-container-high text-secondary hover:text-primary active:scale-95 text-[13px] font-medium whitespace-nowrap transition-all';
      }
    });
  }

  function triggerCelebration() {
    const toast = document.getElementById('toastNotification');
    const saveBtn = document.getElementById('saveBtn');
    
    if (saveBtn) {
      saveBtn.classList.add('scale-95');
      setTimeout(() => saveBtn.classList.remove('scale-95'), 150);
    }

    if (toast) {
      toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2500);
    }
  }
</script></main></body></html>
